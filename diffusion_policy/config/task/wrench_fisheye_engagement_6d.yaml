name: Wrench_Engagement

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    agentview_image:
      shape: [3, 224, 224]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 224, 224]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      # type default: low_dim
    robot0_eef_rot6d:
      shape: [6]
    robot0_gripper_qpos:
      shape: [1]
  action:
    shape: [10] # pos(3), rotation_6d(6), gripper(1)

task_name: &task_name Wrench_Engagement
dataset_type: &dataset_type ph
dataset_path: &dataset_path ./data/DP_data/wrench_fisheye/wrench.zarr
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.wrench_fisheye_engagement_6d_runner.WrenchEngagementEnvRunner
  # dataset_path: *dataset_path
  # shape_meta: *shape_meta
  n_train: 10
  max_steps: 250
  n_train_vis: 2
  # train_start_idx: 0
  n_test: 40
  n_test_vis: 4
  train_start_seed: 46
  test_start_seed: 20043
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  # render_obs_key: 'agentview_image'
  fps: 10
  crf: 22
  # past_action: ${past_action_visible}
  # abs_action: *abs_action
  # tqdm_interval_sec: 1.0
  n_envs: 25
# evaluation at this config requires a 26 core 128GB instance.

dataset:
  _target_: diffusion_policy.dataset.PhyFisheyeImage_6d_Dataset.PhyFisheyeImageDataset
  zarr_path: *dataset_path
  # dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  # n_obs_steps: ${dataset_obs_steps}
  # abs_action: *abs_action
  # rotation_rep: 'rotation_6d'
  # use_legacy_normalizer: False
  # use_cache: True
  seed: 42
  val_ratio: 0.02
